    area: "D7"
    name: "Usage and Engagement"
    points: 4
    severity: "MEDIA"
    verification: "Descripción de la sección: Usage and Engagement - This section analyses user data to gain insights into your users' demographics, behaviours and engagement patterns, helping you make informed product decisions. Preguntas del instrumento: (1) Which target audience is your solution developed for? (2) Is your EdTech product primarily designed for use in a classroom setting? (3) Please describe the recommended usage of your product, including frequency of use (e.g., times per week), whether it is designed for individual or group use, and the suggested duration for each session. (4) Does your product require supervision or specific skills to use? (5) Please explain what type of supervision or skills are required to use this product? (6) Please indicate all appropriate age groups for the users of this product. (7) What skills does your product develop? (8) How many users do you have? (total active + inactive users) (9) How do you define your active users? (10) How is your active user definition linked to the learning outcomes in your product? For instance, your tool needs to be used x times a week in order for it to deliver and sustain the expected learning outcomes. (11) How many active users do you have? (12) What percentage of your active users are girls/women? (13) How many downloads does your product have on Google Play or Apple App Store? (14) What is your year-on-year user growth rates for each of the past two years? (15) What is your product churn rate? Please include your exact way of measuring churn. Tooltip: This information will not be published. (16) In how many countries is your product widely adopted? (Please indicate only the number of countries with a significant number of active users) (17) Which countries have the majority of your active users? (18) Could you explain the broad adoption of your product within particular geographic contexts? (19) Do you gather and assess data on how users interact with your product to understand their engagement levels? (20) Please provide a breakdown of user engagement metrics, such as average session duration and frequency of use. How do these metrics inform your understanding of user interaction with your product? (21) This section analyses user data to gain insights into your users' demographics, behaviours, and engagement patterns, helping you make informed product decisions. It is important to understand your users' needs and preferences to continuously improve your product."
    pass_criteria: "[SIN ANCLA EN LA FUENTE] El instrumento enuncia el puntaje máximo de la sección (4) y sus preguntas, pero NO dice qué respuestas ganan el máximo ni cuál es el mínimo aceptable. Hay que anclarlo con el evaluador antes de puntuar."
