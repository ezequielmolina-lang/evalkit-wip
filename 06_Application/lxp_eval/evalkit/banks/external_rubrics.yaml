  - id: "UNI-3.1"
    area: "D6"
    name: "Learning objectives"
    points: 8
    severity: "ALTA"
    verification: "Descripción de la sección: Learning objectives - This section explains the learning objectives and their relation to a specific curriculum, which is important for understanding the educational goals and outcomes. Preguntas del instrumento: (1) Is the product linked to a national curriculum or a global curricular framework(s)? Check those that apply: (2) List the curriculum(s) and framework(s) your product is currently applied to. (3) Please describe in a single sentence the primary learning objective(s) of your EdTech tool. Example: 'To enhance math skills in students aged 6-12 by utilising adaptive learning algorithms to personalise instruction for each learner.' (4) Pedagogical design - This section delves into the educational approach and structure behind the product, emphasising its significance in delivering effective learning experiences. (5) Could you provide details about the pedagogical design of your product? Specifically, explain how educational theories are incorporated into the design and implementation of the product. (6) Flexibility. Does the product provide flexibility for learner or teacher to act out their intentions and choose their preferred ways of working and get information concerning the learning process? Check those that apply: (7) Learner engagement. Does the product promote significant learner engagement through interactive features and content connection? Check those that apply: (8) Creativity. Does the product enable learners to express themselves and solve problems creatively? Check those that apply: (9) Collaboration. Does the product enable a digital social interaction between learners and instructor, like peer-assessment, peer-support, or collaborative work? Check those that apply: (10) Multimodality. Does the product offer multiple ways of interacting with the content? Check those that apply: (11) Gamification. If the product uses some type of gamification, explain the details below. (12) Assessment. Does the product include assessment tools and functionalities to evaluate learners' progress and performance? Check those that apply: (13) User Experience - This section focuses on the application of best practices in User Experience (UX) / User Interface (UI) design. Best practices in UX/UI design are crucial for creating user-friendly and engaging digital experiences. (14) How have you ensured an intuitive user interface for your users? Please provide examples of improvements, such as the consistent application of usability tests to enhance the product. (15) How do you use evidence and data insights on how your product improves learning outcomes, to inform enhancements to your product? How do you use evidence and data insights on how your product improves learning outcomes, to inform enhancements to your product? (16) Was your product developed with a particular geographical location as focus? Please specify the region, country, or continent if applicable. (17) Has your product undergone testing in specific geographical contexts? If applicable, please list those areas. (18) Is there documentation, contextual support, tutorials and other types of help available to users? (19) How do you ensure that the content used on your product is of high quality? The content used in the product (check those that apply): (20) Communication features. Do your solution's features support communication and collaboration among learners, educators, and stakeholders to boost engagement and knowledge sharing? Select all that apply: (21) This section analyses user data to gain insights into your users' demographics, behaviours, and engagement patterns, helping you make informed product decisions. It is important to understand your users' needs and preferences to continuously improve your product."
    pass_criteria: "[SIN ANCLA EN LA FUENTE] El instrumento enuncia el puntaje máximo de la sección (8) y sus preguntas, pero NO dice qué respuestas ganan el máximo ni cuál es el mínimo aceptable. Hay que anclarlo con el evaluador antes de puntuar."
