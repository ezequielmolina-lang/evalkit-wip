# Banco de criterios de evalkit -- NO editar a mano.
# Generado por lxp_eval/evalkit/banks/build_external_bank.py
#
# Cuatro instrumentos que NO escribió nadie de este proyecto. Las anclas que la
# fuente enuncia van verbatim; las que no enuncia se declaran faltantes con
# `needs_anchors: true` y la marca [SIN ANCLA EN LA FUENTE]. Nunca se sintetiza
# un umbral.
#
# Qué se dejó afuera y por qué está en la cabecera del builder. Leer eso antes
# de agregar nada acá.
#
# Los ids van entre comillas a propósito: sin comillas YAML lee 1.10 como 1.1.

bank_id: "external_rubrics"
version: "1.0"

frameworks:
  - id: "bea_2025_ai_tutor"
    name: "BEA 2025 Shared Task on Pedagogical Ability Assessment of AI-powered Tutors"
    location: "04_Reference_Frameworks/External_Rubrics/BEA_2025_AI_Tutor/BEA_2025_findings.pdf"
    note: >-
      Kochmar, Maurya, Petukhova, Srivatsa, Tack, Vasselli (MBZUAI / KU Leuven /
      NAIST). Cuatro dimensiones pedagógicas con definiciones verbatim y una
      escala de 3 puntos. La rúbrica LXP ya citaba "BEA-MI/ML/PG/AC" como base
      de evidencia sin que la fuente estuviera en el banco.
  - id: "edreports_math_k8"
    name: "EdReports.org Quality Instructional Materials Tool: K-8 Mathematics"
    location: "04_Reference_Frameworks/External_Rubrics/EdReports/EdReports_Math_K8_Review_Criteria.pdf"
    note: >-
      Unidad: la hoja de calificación (Rating Sheet), que es lo que el
      instrumento puntúa y ancla. Los indicadores sueltos no entran: no llevan
      ancla propia y duplicarían el peso de su hoja. Rating Sheet 3.5 tampoco,
      porque la fuente dice "This section is not scored".
  - id: "essa_evidence_tiers"
    name: "ESSA Evidence Tiers (ESSA Section 8101(21)(A)) via US ED / IES / WWC"
    location: "04_Reference_Frameworks/External_Rubrics/ESSA_Evidence_Tiers/ESSA_finding_tier1-3_evidence.pdf"
    note: >-
      Escalera excluyente de 4 niveles. Definiciones verbatim del PDF de
      IES/NCEE; los umbrales numéricos (350 estudiantes, 2 sitios) del
      infográfico oficial WWC->ESSA, citado por entrada.
  - id: "unicef_edtech_for_good"
    name: "UNICEF EdTech for Good Framework, 1st Edition (Nov 2024)"
    location: "04_Reference_Frameworks/External_Rubrics/UNICEF_EdTech_for_Good/EdTechForGoodFramework_1stEdition_1_0.xlsx"
    note: >-
      Hoja "Full assessment": 14 secciones puntuadas en 5 pilares. Cada sección
      trae descripción y puntaje máximo de la fuente, pero el instrumento no
      dice qué gana el máximo: las 14 declaran la falta de ancla. La hoja
      "Quick assessment" es un subconjunto y no se importa.

areas:
  - id: "D2"
    name: "Cognitive Load Theory + multimedia design"
    evidence_base: "Sweller / Mayer; EdReports Rating Sheet 3.1"
  - id: "D4"
    name: "Formative assessment + mastery gating"
    evidence_base: "Rosenshine + BEA; EdReports Rating Sheet 3.3"
  - id: "D5"
    name: "Misconception tracking + refutational teaching"
    evidence_base: "BEA 2025 mistake identification/location"
  - id: "D6"
    name: "Curriculum coherence + EdReports criteria"
    evidence_base: "EdReports Gateways 1-2; UNICEF Pillar 3"
  - id: "D7"
    name: "Teacher in the loop + dashboards"
    evidence_base: "EdReports Rating Sheet 3.2; UNICEF stakeholder feedback"
  - id: "D12"
    name: "Evidence quality (ESSA Tier 1-4)"
    evidence_base: "ESSA Section 8101(21)(A) via US ED / IES / WWC"
  - id: "D14"
    name: "Adaptive Software / Personalization"
    evidence_base: "EdReports Rating Sheet 3.4"
  - id: "PRIV"
    name: "Privacidad y datos de menores"
    evidence_base: "UNICEF EdTech for Good, Pillar 1: Safety First"
  - id: "INFRA"
    name: "Infraestructura, adaptabilidad local y asequibilidad"
    evidence_base: "UNICEF EdTech for Good, Pillar 4: Ready to Scale - área nueva: ninguno de los 14 dominios del banco LXP evalúa si el producto puede desplegarse y pagarse en el contexto"
  - id: "INCL"
    name: "Accesibilidad, equidad de acceso y género"
    evidence_base: "UNICEF EdTech for Good, Pillar 5: Leave No One Behind - área nueva: el banco LXP no puntúa accesibilidad para personas con discapacidad ni equidad de género"

entries:
  - id: "BEA-MI"
    area: "D5"
    name: "Mistake identification"
    points: 1
    severity: "ALTA"
    verification: "Definición de la fuente: Since all dialogues in the dataset contain a mistake made by the student, we expect a good quality response from the tutor to include relevant and clear mistake identification. Anotar la respuesta del tutor en la escala de 3 puntos del instrumento. All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium."
    pass_criteria: "(p. 3) \"Yes\" denotes that it is good (e.g., the mistake is identified clearly and correctly)."
    fail_criteria: "(p. 3) \"No\" denotes that the particular aspect of the tutor response is bad (e.g., the mistake is not identified at all)."
    evidence_base: "BEA 2025 Shared Task, definiciones tomadas de Maurya et al. (2025); alineadas por el paper con los principios de las ciencias del aprendizaje (Chi & Wylie 2014; Mayer 2002). PESO PROPIO: el shared task no pondera las dimensiones (evalúa macro F1 por track), el peso 1 lo pone este banco."
    overlaps:
      - "PT-D4-02"
      - "PT-D5-01"
      - "EMC-8.1"
    source:
      type: "bank"
      framework: "bea_2025_ai_tutor"
      original_id: "mistake_identification"
      location: "04_Reference_Frameworks/External_Rubrics/BEA_2025_AI_Tutor/BEA_2025_findings.pdf#p. 2, §2 (definiciones de Maurya et al. 2025)"
  - id: "BEA-ML"
    area: "D5"
    name: "Mistake location"
    points: 1
    severity: "ALTA"
    verification: "Definición de la fuente: In addition to notifying the student about the committed error, a good tutor response should also point to its location in the answer and explain what the error is to help the student remediate it. Anotar la respuesta del tutor en la escala de 3 puntos del instrumento. All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium."
    pass_criteria: "[SIN ANCLA EN LA FUENTE] El instrumento define la dimensión pero ilustra la escala de 3 puntos sólo para mistake identification. Escala genérica declarada (p. 3): All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium. Falta el umbral específico de esta dimensión; hay que anclarlo antes de puntuar."
    fail_criteria: "[SIN ANCLA EN LA FUENTE] Ver pass_criteria: la fuente no enuncia el umbral de esta dimensión."
    evidence_base: "BEA 2025 Shared Task, definiciones tomadas de Maurya et al. (2025); alineadas por el paper con los principios de las ciencias del aprendizaje (Chi & Wylie 2014; Mayer 2002). PESO PROPIO: el shared task no pondera las dimensiones (evalúa macro F1 por track), el peso 1 lo pone este banco."
    needs_anchors: true
    overlaps:
      - "PT-D5-03"
      - "PT-D5-06"
      - "EMC-8.1"
    source:
      type: "bank"
      framework: "bea_2025_ai_tutor"
      original_id: "mistake_location"
      location: "04_Reference_Frameworks/External_Rubrics/BEA_2025_AI_Tutor/BEA_2025_findings.pdf#p. 2, §2 (definiciones de Maurya et al. 2025)"
  - id: "BEA-PG"
    area: "D4"
    name: "Providing guidance"
    points: 1
    severity: "ALTA"
    verification: "Definición de la fuente: Ideally, a good tutor should not reveal the answer immediately and instead should provide the student with relevant and helpful guidance, consisting, for example, of a hint, an explanation, or a supporting question. Anotar la respuesta del tutor en la escala de 3 puntos del instrumento. All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium."
    pass_criteria: "[SIN ANCLA EN LA FUENTE] El instrumento define la dimensión pero ilustra la escala de 3 puntos sólo para mistake identification. Escala genérica declarada (p. 3): All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium. Falta el umbral específico de esta dimensión; hay que anclarlo antes de puntuar."
    fail_criteria: "[SIN ANCLA EN LA FUENTE] Ver pass_criteria: la fuente no enuncia el umbral de esta dimensión."
    evidence_base: "BEA 2025 Shared Task, definiciones tomadas de Maurya et al. (2025); alineadas por el paper con los principios de las ciencias del aprendizaje (Chi & Wylie 2014; Mayer 2002). PESO PROPIO: el shared task no pondera las dimensiones (evalúa macro F1 por track), el peso 1 lo pone este banco."
    needs_anchors: true
    overlaps:
      - "PT-D4-08"
      - "PT-D1-06"
    source:
      type: "bank"
      framework: "bea_2025_ai_tutor"
      original_id: "providing_guidance"
      location: "04_Reference_Frameworks/External_Rubrics/BEA_2025_AI_Tutor/BEA_2025_findings.pdf#p. 2, §2 (definiciones de Maurya et al. 2025)"
  - id: "BEA-AC"
    area: "D4"
    name: "Actionability"
    points: 1
    severity: "ALTA"
    verification: "Definición de la fuente: Finally, once the guidance is provided to a student, a good tutor response should make it clear to the student what they are supposed to do next. I.e., the tutor's response should not be vague, unclear, or a conversation stopper. Anotar la respuesta del tutor en la escala de 3 puntos del instrumento. All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium."
    pass_criteria: "[SIN ANCLA EN LA FUENTE] El instrumento define la dimensión pero ilustra la escala de 3 puntos sólo para mistake identification. Escala genérica declarada (p. 3): All aspects are annotated on a 3-point scale, where \"No\" denotes that the particular aspect of the tutor response is bad, \"Yes\" denotes that it is good, and \"To some extent\" denotes that the quality of the response, according to the particular aspect, is medium. Falta el umbral específico de esta dimensión; hay que anclarlo antes de puntuar."
    fail_criteria: "[SIN ANCLA EN LA FUENTE] Ver pass_criteria: la fuente no enuncia el umbral de esta dimensión."
    evidence_base: "BEA 2025 Shared Task, definiciones tomadas de Maurya et al. (2025); alineadas por el paper con los principios de las ciencias del aprendizaje (Chi & Wylie 2014; Mayer 2002). PESO PROPIO: el shared task no pondera las dimensiones (evalúa macro F1 por track), el peso 1 lo pone este banco."
    needs_anchors: true
