# Versiones EXACTAS, resueltas el 2026-09-13 sobre Python 3.11 / Linux.
#
# POR QUÉ EXISTE. requirements.txt declara pisos (`>=`), que es lo correcto para
# una librería y lo peor posible para esto: una corrida contra una plataforma en
# vivo dura decenas de minutos y cuesta plata, y `pip install` en una máquina
# nueva puede traer un SDK con otra firma. El motor ya vio ese golpe: el
# docstring de service/retry.py dice "verificado contra anthropic 0.116.0" y hoy
# el índice entrega 1.5.0, o sea un cambio de versión MAYOR por debajo de una
# capa cuyo trabajo es no romperse.
#
#   pip install -r requirements.lock     # despliegue, contenedor, CI reproducible
#   pip install -r requirements.txt      # desarrollo, y para ver si el mundo se movió
#
# El CI corre las dos cosas a propósito: el trabajo `fijado` prueba que esta
# lista funciona, y el trabajo `motor` (flotante, más el cron de los lunes) es lo
# que avisa que llegó la hora de regenerar este archivo:
#
#   pip install -r requirements.txt -r requirements-service.txt && pip freeze > requirements.lock
#
# Linux/CPython 3.11. Trae uvloop, que en Windows no instala: en cosmo usá
# requirements.txt.
